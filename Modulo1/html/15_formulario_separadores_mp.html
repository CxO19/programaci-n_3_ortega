<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Formulario con Separadores</h1>
    <form>
        <fieldset>
            <legend>Datos Personales</legend>
            <label for="nombre">Nombre</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre del propietario">

            <label for="apellido">Apellido</label><br>
            <input type="text" id="apellido" name="apellido" placeholder="Apellido del propietario">
        </fieldset>

        <fieldset>
            <legend>Datos de acceso</legend>
            <label for="email">Correo Electronico</label><br>
            <input type="email" id="email" name="email" placeholder="contacto@inmobiliaria.com">

            <label for="password">Contraseña</label><br>
            <input type="password" id="password" name="password" placeholder="Clave de portal">
        </fieldset>
        <button type="submit">Crear Cuenta</button>
    </form>
</body>
</html>
