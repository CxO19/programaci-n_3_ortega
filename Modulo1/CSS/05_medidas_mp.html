<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú sin JS + color-mix</title>

  <link rel="stylesheet" href="05_medidas_mp.css">
</head>
<body>

    <h1 style="color: tomato;">MEDIDAS</h1>
    <div class="producto-card">🔥 Oportunidad: 20% de descuento en reserva de suite</div>

    <div class="producto-card2">🔥 Oportunidad 2: Bono de $5,000 para gastos de escrituración</div>

  <header class="header">
    <!-- Checkbox oculto -->
    <input type="checkbox" id="toggle-menu">

    <!-- Botón (label) -->
    <label for="toggle-menu" class="btn-menu">☰ Menú Inmobiliario</label>
  </header>

  <!-- Menú controlado solo con CSS -->
  <nav class="menu-movil">
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Catálogo de Propiedades</a></li>
      <li><a href="#">Agendar Visita</a></li>
    </ul>
  </nav>

  <main class="contenedor">
    <h1>Botones con color-mix</h1>

    <button class="btn-primario-suave">Ver Detalles</button>
    <button class="btn-primario-oscuro">Contactar Asesor</button>

    <div class="gradiente-solido caja">Inversión Garantizada</div>

    <div class="imagen">
      <div class="imagen-overlay">Vista Panorámica</div>
    </div>

    <div class="hero-banner">Tu nuevo hogar te espera</div>
    <div class="seccion-destacados">Propiedades Destacadas del Mes</div>
  </main>

</body>
</html>
