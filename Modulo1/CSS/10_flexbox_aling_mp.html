<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Flexbox - align-items</title>
  <link rel="stylesheet" href="10_flexbox_aling_mp.css">
</head>

<body>

  <h2>stretch </h2>
  <div class="contenedor stretch">
    <div class="item">Ficha Técnica</div>
    <div class="item">Galería</div>
    <div class="item">Contacto</div>
  </div>

  <h2>flex-start </h2>
  <div class="contenedor inicio">
    <div class="item">Casa</div>
    <div class="item">Edificio</div>
    <div class="item">Terreno</div>
  </div>

  <h2>flex-end </h2>
  <div class="contenedor fin">
    <div class="item">Vendida</div>
    <div class="item">Rentada</div>
    <div class="item">Disponible</div>
  </div>

  <h2>center </h2>
  <div class="contenedor centro">
    <div class="item">Quito Norte</div>
    <div class="item">Cumbayá</div>
    <div class="item">Valle de los Chillos</div>
  </div>

  <h2>baseline</h2>
  <div class="contenedor baseline">
    <div class="item">Suite</div>
    <div class="item">Departamento</div>
    <div class="item">Penthouse</div>
  </div>


</body>

</html>
