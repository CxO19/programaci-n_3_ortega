<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Menú sin JS + color-mix</title>
  <link rel="stylesheet" href="08_flexbox.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
</head>

<body>

  <h1 style="color: crimson;">FLEXBOX</h1>
  <div class="productos-grid">
    <div class="producto-card">Laptop Pro X1</div>
    <div class="producto-card">Tablet S8</div>
    <div class="producto-card">Monitor 4K</div>
  </div>

  <div class="contenedor">
    <div class="producto-card">Silla</div>
    <div class="producto-card">Mesa</div>
    <div class="producto-card">Cocina</div>
  </div>

  <div class="navbar">
    <div class="producto-card">Silla</div>
    <div class="producto-card">Mesa</div>
    <div class="producto-card">Cocina</div>
  </div>
  
  <br>
  <h2>Justify Content</h2>
   <div class="contenedor-justify">
    <div class="producto-card">Silla</div>
    <div class="producto-card">Mesa</div>
    <div class="producto-card">Cocina</div>
  </div>


</body>

</html>
