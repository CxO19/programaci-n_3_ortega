<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Menú sin JS + color-mix</title>
  <link rel="stylesheet" href="08_flexbox_mp.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
</head>

<body>

  <h1 style="color: crimson;">FLEXBOX</h1>
  <div class="productos-grid">
    <div class="producto-card">Departamento de Lujo</div>
    <div class="producto-card">Casa de Campo</div>
    <div class="producto-card">Oficina Premium</div>
  </div>

  <div class="contenedor">
    <div class="producto-card">Suite</div>
    <div class="producto-card">Penthouse</div>
    <div class="producto-card">Dúplex</div>
  </div>

  <div class="navbar">
    <div class="producto-card">Venta</div>
    <div class="producto-card">Renta</div>
    <div class="producto-card">Proyectos</div>
  </div>
  
  <br>
  <h2>Justify Content</h2>
   <div class="contenedor-justify">
    <div class="producto-card">Norte</div>
    <div class="producto-card">Centro</div>
    <div class="producto-card">Sur</div>
  </div>


</body>

</html>
